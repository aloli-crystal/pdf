name: pdf
version: 1.22.0

description: |
  A pure Crystal library for low-level PDF generation.
  Crystal fork inspired by watzon/pdf.cr (itself inspired by the
  Ruby gem Prawn) — NOT a strict port of any upstream. Versioning
  is independent (3-digit SemVer) and does not track Prawn or
  watzon/pdf.cr release cycles.
  Adds formatted text layout, bounding boxes, column layout, table
  rendering, and SVG rendering on top of the original engine.

authors:
  - Chris Watson <cawatson1993@gmail.com>
  - aloli

crystal: ">= 1.10.0"

license: MIT

dependencies:
  stumpy_jpeg:
    github: stumpycr/stumpy_jpeg
    branch: master
  stumpy_png:
    github: stumpycr/stumpy_png
    version: "~> 5.0"

development_dependencies:
  # Épinglée sur 1.6.x : shard.lock n'étant pas suivi, `~> 1.6` laissait
  # la CI prendre ameba 1.7.0, qui ne compile plus bin/ameba à
  # l'installation et ajoute des règles (170 avertissements). Le passage
  # à 1.7 se fera avec celui à un Crystal récent (voir check-ameba.yml
  # d'asciicrystal).
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6.4"

# CLI metadata tools (poppler-utils equivalents). Pure metadata
# reading over PDF::Reader — no rendering. Reachable on their own or
# via the `alolipdf` front-end (subcommands `info` / `fonts`).
targets:
  pdfinfo:
    main: src/bin/pdfinfo.cr
  pdffonts:
    main: src/bin/pdffonts.cr
  pdfdetach:
    main: src/bin/pdfdetach.cr
  pdfimages:
    main: src/bin/pdfimages.cr
  pdfattach:
    main: src/bin/pdfattach.cr
  pdftoppm:
    main: src/bin/pdftoppm.cr
  pdftocairo:
    main: src/bin/pdftocairo.cr
